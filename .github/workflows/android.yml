name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '25.2.9519653'

    - name: Download Boost and Dependencies Headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libzip-dev libbz2-dev
        # Descargamos los headers de Boost para que el cliente los encuentre sin depender de vcpkg
        wget -q https://archives.boost.io/release/1.82.0/source/boost_1_82_0.tar.gz
        tar -xzf boost_1_82_0.tar.gz
        mv boost_1_82_0/boost ./boost_headers

    - name: Build OTClient for Android
      run: |
        mkdir -p build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=armeabi-v7a \
              -DANDROID_PLATFORM=android-21 \
              -DBOOST_ROOT=$GITHUB_WORKSPACE/boost_headers \
              -DENABLE_ENCRYPTION=ON ..
        make -j$(nproc)

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: '**/*.apk'
